<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Rani Multispeciality Dental Clinic</title>
    <meta name="description" content="View our state-of-the-art clinic, modern equipment, and happy patient smiles.">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/components.js" defer></script>
    <style>
        .page-header {
            background-color: var(--secondary-blue);
            padding: 80px 0;
            text-align: center;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 80px 0;
        }
        .gallery-item {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            aspect-ratio: 1;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        .gallery-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 86, 179, 0.4);
            opacity: 0;
            transition: var(--transition);
        }
        .gallery-item:hover::after {
            opacity: 1;
        }
        .gallery-caption {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            font-weight: 500;
            transition: var(--transition);
            z-index: 10;
        }
        .gallery-item:hover .gallery-caption {
            bottom: 0;
        }
    </style>
</head>
<body>
    <site-navbar></site-navbar>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Clinic Gallery</h1>
                <p style="color: var(--text-light);">A glimpse into our world-class facilities and happy patients.</p>
            </div>
        </section>

        <section class="container gallery-grid">
            <div class="gallery-item">
                <img src="images/gallery1.png" alt="Modern Dental Clinic Interior">
                <div class="gallery-caption">Premium Clinic Interior</div>
            </div>
            
            <div class="gallery-item">
                <img src="images/gallery2.png" alt="Happy Patient Smile">
                <div class="gallery-caption">Brilliant Smiles</div>
            </div>

            <div class="gallery-item">
                <img src="images/gallery3.png" alt="Advanced Dental Equipment">
                <div class="gallery-caption">State-of-the-Art Technology</div>
            </div>
            
            <!-- Placeholders for more images -->
            <div class="gallery-item" style="background-color: var(--secondary-green); display:flex; align-items:center; justify-content:center;">
                <div style="font-size: 3rem;">📸</div>
                <div class="gallery-caption">Reception Area</div>
            </div>
            
            <div class="gallery-item" style="background-color: var(--secondary-blue); display:flex; align-items:center; justify-content:center;">
                <div style="font-size: 3rem;">📸</div>
                <div class="gallery-caption">Before & After Results</div>
            </div>
            
            <div class="gallery-item" style="background-color: #f1c40f; display:flex; align-items:center; justify-content:center;">
                <div style="font-size: 3rem;">📸</div>
                <div class="gallery-caption">Dr. Komal Rani at Work</div>
            </div>
        </section>
    </main>

    <site-footer></site-footer>
    <whatsapp-button></whatsapp-button>
</body>
</html>
